<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check-in OlasDelSur</title>
<script>
(async function () {
  try {
    var urls = [
      'https://raw.githubusercontent.com/olasdelsurelpuerto-alt/check-in/9c2ddcca5212d7c1cb24219fb210de0dda5e43b1/index.html',
      'https://cdn.jsdelivr.net/gh/olasdelsurelpuerto-alt/check-in@9c2ddcca5212d7c1cb24219fb210de0dda5e43b1/index.html'
    ];
    var html = null;
    for (var i = 0; i < urls.length; i++) {
      try {
        var r = await fetch(urls[i], { cache: 'no-store' });
        if (r.ok) { html = await r.text(); if (html && html.indexOf('<!DOCTYPE') === 0) break; }
      } catch (e) {}
    }
    if (!html) throw new Error('restore fetch failed');
    // Point PROXY to the fresh Apps Script deploy without rewriting the whole file
    html = html.replace(
      /const PROXY_ACTION="https:\/\/script\.google\.com\/macros\/s\/[^"]+\/exec"/,
      'const PROXY_ACTION="https://script.google.com/macros/s/AKfycbzf8QXHiPHzz6VmeXBDPC1Gv8dAEufGW4QR_OF3LN4pkldrJutvB9c_WyDT5GK4QeIc/exec"'
    );
    // Anti-duplicati send(): replace only the pinned send() body (scanner/OCR/Tesseract/camera untouched)
    var OLD_SEND = "async function send(){\n  const g=G.data, btn=$(\"rv_send\"), err=$(\"e_send\");\n  btn.disabled=true; err.classList.remove(\"show\");\n  const prev=btn.textContent; btn.textContent=tt(\"sending\");\n  let ok=false;\n  if(PROXY_ACTION){\n    // via proxy: risposta leggibile {ok:true} = riga davvero salvata. 3 tentativi con backoff.\n    // body senza Content-Type custom -> \"simple request\", niente preflight CORS (Apps Script non gestisce OPTIONS)\n    const body=JSON.stringify(Object.fromEntries(buildFormData(g)));\n    for(let i=0;i<3&&!ok;i++){\n      if(i) await new Promise(r=>setTimeout(r,1500*i));\n      try{ const res=await fetch(PROXY_ACTION,{method:\"POST\",body});\n        ok=(await res.json()).ok===true; }catch(e){}\n    }\n  }else{\n    // legacy diretto al Form: la risposta e' opaca (no-cors) -> si assume ok se la rete non fallisce\n    try{ await fetch(FORM_ACTION,{method:\"POST\",mode:\"no-cors\",\n        headers:{\"Content-Type\":\"application/x-www-form-urlencoded\"},\n        body:buildFormData(g).toString()}); ok=true; }catch(e){}\n  }\n  btn.textContent=prev;\n  if(ok) showScreen(\"screen-done\",4);\n  else{ // fallback visibile: l'ospite riprova o mostra questa schermata (con tutti i dati) all'host\n    btn.disabled=false; err.textContent=tt(\"send_err\"); err.classList.add(\"show\");\n    err.scrollIntoView({behavior:\"smooth\",block:\"center\"});\n  }\n}";
    var NEW_SEND = "let sendInFlight=false;\nasync function send(){\n  if(sendInFlight) return;\n  const g=G.data, btn=$(\"rv_send\"), err=$(\"e_send\");\n  sendInFlight=true;\n  btn.disabled=true; err.classList.remove(\"show\");\n  const prev=btn.textContent; btn.textContent=tt(\"sending\");\n  let ok=false, ambiguous=false;\n  if(PROXY_ACTION){\n    // via proxy: {ok:true} = riga salvata. Anti-duplicati: requestId.\n    // Un solo retry, solo se la rete fallisce prima di qualsiasi risposta.\n    // Se dopo 8s non arriva JSON, niente secondo POST: schermata finale comunque\n    // (il redirect Apps Script a volte non torna, ma il form e' gia' salvato).\n    const requestId=(crypto.randomUUID?crypto.randomUUID():(\"r\"+Date.now().toString(36)+Math.random().toString(36).slice(2,10)));\n    const body=JSON.stringify(Object.assign(Object.fromEntries(buildFormData(g)),{requestId:requestId}));\n    const SEND_TIMEOUT_MS=8000;\n    let attempt=0, allowRetry=false;\n    while(attempt<2 && !ok && !ambiguous && (attempt===0 || allowRetry)){\n      if(attempt) await new Promise(r=>setTimeout(r,1500));\n      allowRetry=false;\n      const outcome=await new Promise(function(resolve){\n        var done=false;\n        var timer=setTimeout(function(){ if(!done){ done=true; resolve(\"timeout\"); } }, SEND_TIMEOUT_MS);\n        fetch(PROXY_ACTION,{method:\"POST\",body:body}).then(function(res){\n          return res.json().then(function(data){ return data; }, function(){ return null; });\n        }).then(function(data){\n          if(done) return;\n          done=true; clearTimeout(timer);\n          resolve(data && data.ok===true ? \"ok\" : \"answered\");\n        }).catch(function(){\n          if(done) return;\n          done=true; clearTimeout(timer);\n          resolve(\"net\");\n        });\n      });\n      if(outcome===\"ok\") ok=true;\n      else if(outcome===\"timeout\") ambiguous=true;\n      else if(outcome===\"net\") allowRetry=true;\n      attempt++;\n    }\n  }else{\n    try{ await fetch(FORM_ACTION,{method:\"POST\",mode:\"no-cors\",\n        headers:{\"Content-Type\":\"application/x-www-form-urlencoded\"},\n        body:buildFormData(g).toString()}); ok=true; }catch(e){}\n  }\n  btn.textContent=prev;\n  if(ok || ambiguous) showScreen(\"screen-done\",4);\n  else{\n    sendInFlight=false;\n    btn.disabled=false; err.textContent=tt(\"send_err\"); err.classList.add(\"show\");\n    err.scrollIntoView({behavior:\"smooth\",block:\"center\"});\n  }\n}";
    if (html.indexOf(OLD_SEND) === -1) throw new Error('send() patch target missing');
    html = html.replace(OLD_SEND, NEW_SEND);
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.body.innerHTML = '<p style="font-family:sans-serif;padding:24px">Check-in temporalmente no disponible. Recarga en unos segundos.</p>';
  }
})();
</script>
</head>
<body style="font-family:sans-serif;padding:24px">Cargando check-in…</body>
</html>
